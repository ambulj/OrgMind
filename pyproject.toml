[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmind"
version = "0.1.0"
description = "Company Brain Knowledge Graph & Agent on FalkorDB"
authors = [{ name = "OrgMind Team" }]
dependencies = [
    "falkordb>=1.0.10",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "streamlit>=1.36.0",
    "pyvis>=0.3.2",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orgmind*"]
